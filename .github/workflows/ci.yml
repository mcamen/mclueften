name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      # ci statt install: installiert exakt die Versionen aus package-lock.json
      # und schlägt fehl, wenn Lockfile und package.json auseinanderlaufen.
      - run: npm ci
      - run: npm run lint
      - run: npm test
